<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시즌 D-day · 마케터 데일리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Figtree:wght@400;500;600;700&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<style>
  /* DESIGN.md 토큰 — 모바일 우선, 크기는 화면 너비에 따라 부드럽게 커짐(clamp) */
  :root {
    --color-cream: #ffffeb;
    --color-ink: #1a1a1a;
    --color-lavender: #f0d7ff;
    --color-lavender-hover: #e6c4fa;
    --color-forest: #034f46;
    --color-ember: #ffa946;
    --color-stone: #e4e4d0;
    --color-fog: #8a8a80;
    --color-fog-dark: #6b6b62;
    --color-charcoal: #222222;
    --color-white: #ffffff;

    --font-display: 'EB Garamond', 'Noto Serif KR', serif;
    --font-body: 'Figtree', 'Pretendard Variable', 'Pretendard', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

    /* 390px → 1200px 사이에서 선형으로 커짐 */
    --text-display: clamp(56px, 2.5rem + 6vw, 120px);
    --text-heading-lg: clamp(34px, 1.5rem + 3.5vw, 64px);
    --text-heading-sm: clamp(24px, 1rem + 1.5vw, 32px);
    --text-lead: clamp(16px, 0.875rem + 0.5vw, 20px);

    --gutter: clamp(16px, 4vw, 40px);
    --stack-gap: clamp(24px, 3vw, 32px);
    --card-padding: clamp(20px, 3vw, 32px);
    --hero-pad-y: clamp(32px, 5vw, 56px);
    --hero-pad-x: clamp(24px, 5vw, 64px);

    --border-ink: 2px solid var(--color-ink);
    --radius-tag: 8px;
    --radius-control: 12px;
    --radius-card: clamp(24px, 3vw, 32px);
    --radius-section: clamp(32px, 5vw, 64px);
    --radius-pill: 9999px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--color-cream);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  /* 공통 코드가 body 맨 앞에 넣는 메뉴 바를 디자인에 맞춰 꾸밈 (공통 코드는 수정하지 않음) */
  body > div:first-child {
    max-width: 1200px;
    margin: 12px auto 0;
    padding: 0 max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left));
  }
  body > div:first-child > nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px;
    padding: 8px 12px !important;
    border: var(--border-ink) !important;
    border-radius: var(--radius-pill);
    background: var(--color-cream);
    color: var(--color-fog);
    font-size: 14px;
    font-weight: 500;
  }
  body > div:first-child > nav a {
    display: inline-flex;
    align-items: center;
    min-height: 32px;
    padding: 4px 4px;
    color: var(--color-charcoal);
    text-decoration: none;
  }
  body > div:first-child > nav a[href="season.html"] {
    background: var(--color-lavender);
    border: var(--border-ink);
    border-radius: var(--radius-control);
    padding: 2px 8px;
  }
  body > div:first-child > p {
    margin: 10px 0 0;
    padding: 0 4px !important;
    font-size: 13px;
    color: var(--color-fog-dark);
  }

  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--color-forest);
    outline-offset: 2px;
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px max(var(--gutter), env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    gap: var(--stack-gap);
  }

  /* 상단: 가장 가까운 공휴일 (다크 챔버) — 모바일은 세로, 태블릿 이상은 좌우 */
  .hero {
    background: var(--color-ink);
    color: var(--color-cream);
    border-radius: var(--radius-section);
    padding: var(--hero-pad-y) var(--hero-pad-x);
    display: grid;
    grid-template-columns: 1fr;
    align-items: end;
    gap: 20px 48px;
  }
  .hero-name {
    margin: 16px 0 8px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: var(--text-heading-lg);
    line-height: 1.1;
    letter-spacing: -0.03em;
  }
  .hero-date { margin: 0; font-size: var(--text-lead); color: var(--color-stone); }
  .hero-dday {
    margin: 0;
    justify-self: start;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: var(--text-display);
    line-height: 1.05;
    letter-spacing: -0.03em;
    white-space: nowrap;
  }
  .hero-dday .squiggle {
    display: block;
    width: 100%;
    height: 14px;
    margin-top: 4px;
  }
  .hero-error { margin: 16px 0 0; font-size: var(--text-lead); color: var(--color-stone); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    font-weight: 500;
    font-size: 14px;
    line-height: 1;
  }
  .badge--forest { background: var(--color-forest); color: var(--color-cream); }
  .badge--outline { border: 1.5px solid var(--color-white); color: var(--color-cream); }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--color-ember);
  }

  /* 시간대 미리보기 전환 */
  .slots {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .slots-label { font-size: 14px; color: var(--color-fog-dark); margin-right: 4px; }
  .slots a {
    display: inline-flex;
    align-items: center;
    min-height: 40px;
    padding: 8px 18px;
    border: var(--border-ink);
    border-radius: var(--radius-pill);
    color: var(--color-ink);
    text-decoration: none;
    font-weight: 500;
    font-size: 14px;
    background: var(--color-cream);
  }
  .slots a[aria-current="true"] { background: var(--color-lavender); }

  /* 카드 */
  .card {
    background: var(--color-cream);
    border: var(--border-ink);
    border-radius: var(--radius-card);
    padding: var(--card-padding);
  }
  .card-head {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 20px;
  }
  .card-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: var(--text-heading-sm);
    line-height: 1.3;
    letter-spacing: -0.03em;
  }
  .card-sub { margin: 0; font-size: 14px; color: var(--color-fog-dark); }
  .msg { margin: 0; color: var(--color-fog-dark); }

  /* 아침: 공휴일 목록 — 모바일은 줄 목록, 데스크톱은 5칸 타일 */
  .holidays { list-style: none; margin: 0; padding: 0; }
  .holidays li {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 16px;
    padding: 14px 0;
    border-top: 2px solid var(--color-stone);
  }
  .holidays li:first-child { border-top: none; padding-top: 0; }
  .holidays li:last-child { padding-bottom: 0; }
  .h-name { font-size: 18px; font-weight: 600; }
  .h-date { grid-column: 1; font-size: 14px; color: var(--color-fog-dark); }
  .tag {
    grid-row: 1 / span 2;
    grid-column: 2;
    padding: 8px 14px;
    border-radius: var(--radius-tag);
    background: var(--color-ink);
    color: var(--color-cream);
    font-weight: 500;
    font-size: 14px;
    white-space: nowrap;
  }
  .holidays li.is-next .tag { background: var(--color-lavender); color: var(--color-ink); border: var(--border-ink); }

  /* 점심: 체크리스트 — 모바일 1열, 태블릿 2열, 데스크톱 4열 */
  .checks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .checks label {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 56px;
    height: 100%;
    padding: 14px 18px;
    border: var(--border-ink);
    border-radius: var(--radius-control);
    background: var(--color-cream);
    cursor: pointer;
    font-size: 17px;
    font-weight: 500;
  }
  .checks input {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 24px; height: 24px;
    margin: 0;
    border: var(--border-ink);
    border-radius: 6px;
    background: var(--color-cream);
    display: grid;
    place-content: center;
    cursor: pointer;
  }
  .checks input:checked { background: var(--color-forest); border-color: var(--color-forest); }
  .checks input:checked::after {
    content: "";
    width: 6px; height: 12px;
    border: solid var(--color-cream);
    border-width: 0 2.5px 2.5px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  .checks input:checked + span { text-decoration: line-through; color: var(--color-fog-dark); }

  /* 저녁: 완료율 + 메모 — 모바일 세로, 태블릿 이상 좌우 */
  .evening-grid { display: grid; grid-template-columns: 1fr; gap: 32px; }
  .rate {
    margin: 0 0 16px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: var(--text-heading-lg);
    line-height: 1.05;
    letter-spacing: -0.03em;
  }
  .bar {
    height: 20px;
    border: var(--border-ink);
    border-radius: var(--radius-pill);
    background: var(--color-cream);
    overflow: hidden;
  }
  .bar > span { display: block; height: 100%; background: var(--color-lavender); width: 0; transition: width .3s; }
  .bar-done { margin: 12px 0 0; font-size: 14px; color: var(--color-fog-dark); }

  .memo-form { display: flex; flex-direction: column; gap: 12px; }
  .memo-form label { font-weight: 600; }
  .memo-row { display: flex; flex-direction: column; gap: 8px; }
  .memo-row input {
    flex: 1;
    min-width: 0;
    min-height: 52px;
    padding: 14px 16px;
    border: var(--border-ink);
    border-radius: var(--radius-control);
    background: var(--color-cream);
    color: var(--color-ink);
    font: 400 16px var(--font-body); /* 16px 이상이어야 iOS가 확대하지 않음 */
  }
  .memo-row input::placeholder { color: var(--color-fog-dark); }
  .btn {
    min-height: 52px;
    padding: 14px 24px;
    border: var(--border-ink);
    border-radius: var(--radius-control);
    background: var(--color-lavender);
    color: var(--color-ink);
    font: 500 16px var(--font-body);
    cursor: pointer;
    white-space: nowrap;
  }
  .memo-saved { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; font-size: 14px; color: var(--color-fog-dark); }

  /* 마우스가 있는 기기에서만 hover (터치에서 색이 남는 문제 방지) */
  @media (hover: hover) {
    body > div:first-child > nav a:hover { text-decoration: underline; }
    .slots a:hover { background: var(--color-stone); }
    .slots a[aria-current="true"]:hover { background: var(--color-lavender-hover); }
    .checks label:hover { background: var(--color-stone); }
    .btn:hover { background: var(--color-lavender-hover); }
  }

  /* 아주 작은 폰 (≤ 360px) */
  @media (max-width: 360px) {
    body > div:first-child > nav { font-size: 13px; padding: 6px 10px !important; }
    .slots-label { width: 100%; }
    .tag { padding: 6px 10px; font-size: 13px; }
  }

  /* 큰 폰 · 작은 태블릿 (≥ 560px) */
  @media (min-width: 560px) {
    .checks { grid-template-columns: repeat(2, 1fr); }
  }

  /* 메모 입력칸 + 버튼 가로 배치: 저녁 카드가 한 줄일 때(560~767) 또는 넓을 때(≥ 1024)만 */
  @media (min-width: 560px) and (max-width: 767px), (min-width: 1024px) {
    .memo-row { flex-direction: row; }
  }

  /* 태블릿 (≥ 768px) */
  @media (min-width: 768px) {
    body > div:first-child { margin-top: 16px; }
    body > div:first-child > nav { gap: 4px 6px; padding: 10px 20px !important; font-size: 16px; }
    body > div:first-child > nav a { padding: 4px 6px; }
    body > div:first-child > nav a[href="season.html"] { padding: 4px 12px; }
    body > div:first-child > p { font-size: 14px; }
    main { padding-top: 24px; }

    .hero { grid-template-columns: 1fr auto; }
    .hero-dday { justify-self: end; }

    .card-head {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 16px;
      margin-bottom: 24px;
    }
    .evening-grid { grid-template-columns: 1fr 1fr; gap: 48px; }
    .h-name { font-size: 20px; }
  }

  /* 데스크톱 (≥ 1024px) */
  @media (min-width: 1024px) {
    main { padding-bottom: 96px; }
    .checks { grid-template-columns: repeat(4, 1fr); }
    .checks label { flex-direction: column; align-items: flex-start; justify-content: space-between; min-height: 140px; padding: 20px; font-size: 20px; }

    /* 공휴일 5개를 가로 타일로 */
    .holidays { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
    .holidays li,
    .holidays li:first-child,
    .holidays li:last-child {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: 20px;
      border: var(--border-ink);
      border-radius: var(--radius-control);
    }
    .holidays li.is-next { background: var(--color-lavender); }
    .holidays li.is-next .tag { background: var(--color-ink); color: var(--color-cream); border: none; }
    .tag { order: -1; margin-bottom: 8px; }
    .h-name { font-size: 22px; line-height: 1.3; }
  }

  /* 가로로 눕힌 폰: 상단 카드가 화면을 다 차지하지 않게 */
  @media (max-height: 500px) and (orientation: landscape) {
    :root { --text-display: 64px; --text-heading-lg: 36px; --hero-pad-y: 24px; }
    .hero { grid-template-columns: 1fr auto; }
    .hero-dday { justify-self: end; }
  }
</style>
</head>
<body>
<main>
  <!-- 상단: 가장 가까운 공휴일 -->
  <header class="hero" aria-live="polite">
    <div>
      <span class="badge badge--outline"><span class="dot" aria-hidden="true"></span>가장 가까운 공휴일</span>
      <h1 class="hero-name" id="next-name">불러오는 중…</h1>
      <p class="hero-date" id="next-date"></p>
      <p class="hero-error" id="hero-error" hidden>데이터를 불러오지 못했어요</p>
    </div>
    <p class="hero-dday" id="next-dday" hidden>
      <span id="next-dday-text"></span>
      <svg class="squiggle" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true">
        <path d="M2 9 C 20 2, 36 13, 54 7 S 88 2, 106 8 S 140 13, 158 6 S 188 3, 198 8" fill="none" stroke="#f0d7ff" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </p>
  </header>

  <!-- 시간대 미리보기 (?t=) -->
  <nav class="slots" aria-label="시간대 미리보기">
    <span class="slots-label">시간대 보기</span>
    <a href="?t=morning" data-t="morning">아침</a>
    <a href="?t=lunch" data-t="lunch">점심</a>
    <a href="?t=evening" data-t="evening">저녁</a>
  </nav>

  <!-- 아침: 다가오는 공휴일 5개 -->
  <section data-slot="morning" class="card">
    <div class="card-head">
      <h2 class="card-title">다가오는 공휴일</h2>
      <p class="card-sub">시즌 캠페인 일정을 미리 잡아 두세요</p>
    </div>
    <p class="msg" id="list-msg">불러오는 중…</p>
    <ol class="holidays" id="holiday-list"></ol>
  </section>

  <!-- 점심: 캠페인 준비 체크리스트 -->
  <section data-slot="lunch" class="card">
    <div class="card-head">
      <h2 class="card-title">캠페인 준비 체크리스트</h2>
      <p class="card-sub" id="check-target">가장 가까운 공휴일 기준</p>
    </div>
    <ul class="checks" id="check-list"></ul>
  </section>

  <!-- 저녁: 완료율 + 오늘 한 일 메모 -->
  <section data-slot="evening" class="card">
    <div class="card-head">
      <h2 class="card-title">오늘의 마무리</h2>
      <p class="card-sub" id="evening-target"></p>
    </div>
    <div class="evening-grid">
      <div>
        <p class="rate" id="rate">0%</p>
        <div class="bar" role="progressbar" aria-label="체크리스트 완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><span id="bar-fill"></span></div>
        <p class="bar-done" id="bar-done"></p>
      </div>
      <form class="memo-form" id="memo-form">
        <label for="memo-input">오늘 한 일 한 줄</label>
        <div class="memo-row">
          <input id="memo-input" type="text" maxlength="100" placeholder="예: 크리스마스 카피 초안 3개 작성" autocomplete="off">
          <button class="btn" type="submit">저장하기</button>
        </div>
        <p class="memo-saved" id="memo-saved" hidden><span class="badge badge--forest">✓ 저장됨</span><span id="memo-saved-text"></span></p>
      </form>
    </div>
  </section>
</main>

<script>
// 시즌 D-day 페이지 로직. load/save/SLOT/TODAY는 아래 공통 코드에서 정의되므로 DOM 로드 후에 실행한다.
const API_URL = "https://date.nager.at/api/v3/NextPublicHolidays/KR";
const CHECK_ITEMS = ["기획", "카피", "이미지", "업로드 예약"];
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];

function toDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function daysUntil(s) {
  return Math.round((toDate(s) - toDate(TODAY)) / 86400000);
}
function ddayText(n) {
  return n === 0 ? "D-DAY" : "D-" + n;
}
function fmtDate(s) {
  const d = toDate(s);
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`;
}
function fmtRange(h) {
  return h.start === h.end ? fmtDate(h.start) : `${fmtDate(h.start)} – ${fmtDate(h.end)}`;
}

// 설날·추석처럼 며칠 이어지는 같은 이름의 공휴일을 하나로 묶는다
function groupHolidays(list) {
  const groups = [];
  list
    .filter(h => h && h.date && h.localName && daysUntil(h.date) >= 0)
    .sort((a, b) => a.date.localeCompare(b.date))
    .forEach(h => {
      const last = groups[groups.length - 1];
      if (last && last.name === h.localName && (toDate(h.date) - toDate(last.end)) / 86400000 <= 3) {
        last.end = h.date;
        last.multi = true;
      } else {
        groups.push({ name: h.localName, start: h.date, end: h.date, multi: false });
      }
    });
  groups.forEach(g => { if (g.multi) g.name += " 연휴"; });
  return groups;
}

async function fetchHolidays() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const res = await fetch(API_URL, { signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const groups = groupHolidays(Array.isArray(data) ? data : []);
    if (!groups.length) throw new Error("empty");
    return groups;
  } finally {
    clearTimeout(timer);
  }
}

// ----- 상단 + 아침 -----
function renderHero(next) {
  document.getElementById("next-name").textContent = next.name;
  document.getElementById("next-date").textContent = fmtRange(next);
  document.getElementById("next-dday-text").textContent = ddayText(daysUntil(next.start));
  document.getElementById("next-dday").hidden = false;
}
function renderHeroError() {
  document.getElementById("next-name").textContent = "시즌 D-day";
  document.getElementById("hero-error").hidden = false;
}
function renderList(groups) {
  const ol = document.getElementById("holiday-list");
  ol.innerHTML = "";
  groups.slice(0, 5).forEach((g, i) => {
    const li = document.createElement("li");
    if (i === 0) li.className = "is-next";
    const name = document.createElement("span");
    name.className = "h-name";
    name.textContent = g.name;
    const date = document.createElement("span");
    date.className = "h-date";
    date.textContent = fmtRange(g);
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = ddayText(daysUntil(g.start));
    li.append(name, tag, date);
    ol.append(li);
  });
  document.getElementById("list-msg").hidden = true;
}

// ----- 점심 + 저녁: 체크리스트 (season_checks) -----
// 저장 형태: { target: "2026-12-25 크리스마스", items: [bool x4] } — 가장 가까운 공휴일이 바뀌면 새로 시작
let checks = { target: null, items: CHECK_ITEMS.map(() => false) };

function initChecks(next) {
  const stored = load("season_checks", null);
  const target = next ? `${next.start} ${next.name}` : null;
  const valid = stored && Array.isArray(stored.items) && stored.items.length === CHECK_ITEMS.length;
  if (valid && (!target || stored.target === target)) {
    checks = { target: stored.target, items: stored.items.map(Boolean) };
  } else {
    checks = { target, items: CHECK_ITEMS.map(() => false) };
    save("season_checks", checks);
  }
  const label = next ? `${next.name} · ${ddayText(daysUntil(next.start))}` : (checks.target ? checks.target.slice(11) : "가장 가까운 공휴일 기준");
  document.getElementById("check-target").textContent = label;
  document.getElementById("evening-target").textContent = label + " 준비 현황";
  renderChecks();
  renderRate();
}
function renderChecks() {
  const ul = document.getElementById("check-list");
  ul.innerHTML = "";
  CHECK_ITEMS.forEach((item, i) => {
    const li = document.createElement("li");
    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = checks.items[i];
    box.addEventListener("change", () => {
      checks.items[i] = box.checked;
      save("season_checks", checks);
      renderRate();
    });
    const text = document.createElement("span");
    text.textContent = item;
    label.append(box, text);
    li.append(label);
    ul.append(li);
  });
}
function renderRate() {
  const done = checks.items.filter(Boolean).length;
  const pct = Math.round((done / CHECK_ITEMS.length) * 100);
  document.getElementById("rate").textContent = pct + "%";
  document.getElementById("bar-fill").style.width = pct + "%";
  document.getElementById("bar").setAttribute("aria-valuenow", pct);
  document.getElementById("bar-done").textContent =
    `${CHECK_ITEMS.length}개 중 ${done}개 완료` +
    (done < CHECK_ITEMS.length ? ` · 남은 일: ${CHECK_ITEMS.filter((_, i) => !checks.items[i]).join(", ")}` : " · 준비 끝!");
}

// ----- 저녁: 오늘 한 일 메모 (season_memo) -----
// 저장 형태: { date: "YYYY-MM-DD", text: "..." } — 날짜가 바뀌면 빈칸으로 시작
function initMemo() {
  const input = document.getElementById("memo-input");
  const memo = load("season_memo", null);
  if (memo && memo.date === TODAY && typeof memo.text === "string") {
    input.value = memo.text;
    showSaved(memo.text);
  }
  document.getElementById("memo-form").addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    save("season_memo", { date: TODAY, text });
    showSaved(text);
  });
}
function showSaved(text) {
  document.getElementById("memo-saved").hidden = !text;
  document.getElementById("memo-saved-text").textContent = text ? `오늘 기록: ${text}` : "";
}

document.addEventListener("DOMContentLoaded", async () => {
  document.querySelectorAll(".slots a").forEach(a => {
    if (a.dataset.t === SLOT) a.setAttribute("aria-current", "true");
  });
  initMemo();
  try {
    const groups = await fetchHolidays();
    renderHero(groups[0]);
    renderList(groups);
    initChecks(groups[0]);
  } catch (e) {
    renderHeroError();
    document.getElementById("list-msg").textContent = "데이터를 불러오지 못했어요";
    initChecks(null);
  }
});
</script>

<script>
// ===== 공통: 상단 메뉴 + 시간대 + 방문 기록 (4페이지 동일) =====
function getSlot() {
  const t = new URLSearchParams(location.search).get("t");
  if (["morning", "lunch", "evening"].includes(t)) return t;
  const h = new Date().getHours();
  if (h >= 6 && h < 11) return "morning";
  if (h >= 11 && h < 16) return "lunch";
  return "evening";
}
const SLOT = getSlot();
const TODAY = new Date().toLocaleDateString("sv-SE"); // YYYY-MM-DD
function load(k, d) { try { const v = localStorage.getItem("mkt_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem("mkt_" + k, JSON.stringify(v)); } catch (e) {} }

let visits = load("visits", { date: TODAY, count: 0 });
if (visits.date !== TODAY) visits = { date: TODAY, count: 0 };
visits.count++; save("visits", visits);

let streak = load("streak", { last: null, days: 0 });
if (streak.last !== TODAY) {
  const y = new Date(Date.now() - 86400000).toLocaleDateString("sv-SE");
  streak.days = streak.last === y ? streak.days + 1 : 1;
  streak.last = TODAY; save("streak", streak);
}

const SLOT_NAME = { morning: "🌅 아침", lunch: "☀️ 점심", evening: "🌙 저녁" }[SLOT];
const bar = document.createElement("div");
bar.innerHTML = `<nav style="padding:10px;border-bottom:1px solid #ddd">
  <a href="index.html">홈</a> · <a href="ad.html">광고비 환산</a> ·
  <a href="season.html">시즌 D-day</a> · <a href="weather.html">날씨 소재</a></nav>
  <p style="padding:0 10px">${SLOT_NAME} · 오늘 ${visits.count}번째 방문 · 연속 ${streak.days}일째</p>`;
document.body.prepend(bar);

// data-slot="morning|lunch|evening" 이 붙은 영역 중 지금 시간대만 보이기
document.querySelectorAll("[data-slot]").forEach(el => { el.hidden = el.dataset.slot !== SLOT; });
</script>
</body>
